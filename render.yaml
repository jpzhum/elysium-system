services:
  - type: web
    name: elysium-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: HABITANTE_ROLE_ID
        sync: false
      - key: VISITANTE_ROLE_ID
        sync: false
      - key: PANEL_CHANNEL_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: EXPEDITION_CHANNEL_ID
        sync: false
      - key: EXPEDITION_BANNER_URL
        sync: false
      - key: HOST_ROLE_ID
        sync: false
      - key: EXPEDITION_VOICE_CATEGORY_ID
        sync: false
      - key: TEMP_VOICE_EMPTY_TIMEOUT_SECONDS
        value: 600
      - key: TEMP_VOICE_BITRATE_KBPS
        value: 384
      - key: BOLETIM_CHANNEL_ID
        sync: false
      - key: EVENTOS_ROLE_ID
        sync: false
      - key: BOLETIM_MANAGER_ROLE_IDS
        sync: false
      - key: EXPEDICOES_CHANNEL_ID
        sync: false
